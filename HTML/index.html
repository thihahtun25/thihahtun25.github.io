<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello HTML</h1>

    <!-- tag -->
     <p></p>
     
     <!-- element -->
<p>Hello</p>
<div>
    <h2>Hi</h2>
</div>

<!-- Attribute -->
    <!-- key = "value" -->
    <p align="right">This is p element 1</p>
    <p align="center">This is p element 2</p>
    <p align="left">This is p element 3</p>

    <!-- Global Attribute -->
    <!--
        class and id
        class -> အုပ်စုဖွဲ့သုံးချင်တဲ့အခါသုံး
        id -> unique ဖြစ်တဲ့အခါသုံး
    -->

    <p class="p-text p-element p-tag" id="p4">This is p element 4</p>
    <p class="p-text" id="p5">This is p element 5</p>

    <h1>Hello</h1>
    <H1>Hi</H1>

    <p>Hello my stuednt.</p>

    <!-- Urgly Code -->
    <div><div><h1>Title 1</h1><p>This is paragraph</p></div><div><h1>Titl 2</h1><p>This is paragraph</p></div></div>

    <!-- Pretty Code -->
    <div>
        <div>
            <h1>Title 1</h1>
            <p>This is paragraph</p>
        </div>
        <div>
            <h1>Title 2</h1>
            <p>This is paragraph</p>
        </div>
    </div>
</body>
</html>
